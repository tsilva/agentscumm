  index_md5: 1dd1b7c042f0c7345730a94633d283fe
telemetry: snapshot
scoring: highest_stage
rooms:
  xenon-awards: 68
  credits: 2
variables:
  score: { bank: globals, index: 15 }
  previous-room: { bank: globals, index: 12 }
milestones:
  - id: reached-xenon-awards
    label: Reached the Xenon awards ceremony
    when:
      all:
        - { room: xenon-awards }
        - { variable: previous-room, equals: 71 }
